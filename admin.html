<title>ОСНОВА · Админка</title>
<style>
/* =====================================================================
   ZT Light UI — админка ОСНОВЫ.
   Та же визуальная система, что и в рабочем месте цензора:
   токены из design_tokens.json, только светлая тема, белые поля.
   ===================================================================== */
:root{
  --primary:#6F3DFF; --primary-hover:#5E2FE8; --secondary:#A78BFA;
  --lilac:#EDE9FE; --mint:#10B981; --soft-mint:#E0F7F1;
  --soft-blue:#DBEAFE; --soft-pink:#FCE7F3; --soft-beige:#FDECD8;
  --bg:#FAFAFC; --surface:#FFFFFF; --text:#1F2937; --muted:#6B7280;
  --border:#E5E7EB; --border-soft:#F1F2F5;
  --danger:#DC2626; --warning:#D97706; --success:#059669;
  --r-card:18px; --r-btn:13px; --r-input:11px;
  --shadow:0 1px 2px rgba(31,41,55,.04), 0 4px 16px rgba(31,41,55,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--text);
  font-family:Inter,Arial,Helvetica,sans-serif; font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary); outline-offset:2px; border-radius:8px}
.tnum{font-variant-numeric:tabular-nums}
svg{flex:none}

.app{display:grid; grid-template-columns:240px 1fr; min-height:100%}
.sidebar{background:var(--surface); border-right:1px solid var(--border); padding:20px 14px 16px;
  display:flex; flex-direction:column; gap:4px; position:sticky; top:env(safe-area-inset-top,0px); height:100vh}
.brand{display:flex; align-items:center; gap:10px; padding:2px 8px 20px}
.brand img{height:26px; width:auto; display:block}
.brand-name{font-size:17px; font-weight:700}
.brand-sub{font-size:12px; color:var(--muted); margin-top:1px}
.rolebox{background:var(--lilac); border:1px solid #D6CCFB; border-radius:12px; padding:10px 12px; margin-bottom:16px}
.rolebox .lab{font-size:11px; color:var(--primary); text-transform:uppercase; letter-spacing:.7px; font-weight:700}
.rolebox .val{font-weight:650; margin-top:2px; font-size:15px; color:var(--primary)}
.nav{display:flex; flex-direction:column; gap:3px}
.nav button{display:flex; align-items:center; gap:11px; width:100%; background:transparent; border:0;
  color:var(--muted); text-align:left; padding:10px 12px; border-radius:11px; font-size:15px; font-weight:550}
.nav button:hover{background:var(--bg); color:var(--text)}
.nav button.active{background:var(--lilac); color:var(--primary); font-weight:650}
.nav .ico{display:grid; place-items:center; width:20px; height:20px}
.nav .badge{margin-left:auto; font-size:13px; font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto; padding:14px 10px 0; border-top:1px solid var(--border); color:var(--muted); font-size:12px; line-height:1.5}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{height:68px; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 28px;
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20}
.top-title{font-size:17px; font-weight:650}
.top-sub{color:var(--muted); font-size:13px}
.user{display:flex; align-items:center; gap:10px}
.avatar{width:36px; height:36px; border-radius:11px; background:var(--soft-blue); color:#2563EB;
  display:grid; place-items:center; font-weight:700; font-size:13px}
.content{padding:26px 28px 64px; max-width:1200px; width:100%}
.page-head{margin-bottom:22px}
.page-head h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.5px}
.page-head p{margin:5px 0 0; color:var(--muted); font-size:15px}

.stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:22px}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:18px 20px}
.stat .badge-ico{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; margin-bottom:12px}
.stat .k{font-size:13px; color:var(--muted); margin-bottom:6px}
.stat .v{font-size:27px; font-weight:700; letter-spacing:-.6px; line-height:1.1}
.stat .d{font-size:13px; color:var(--muted); margin-top:5px}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:22px 24px; margin-bottom:14px}
.card h3{margin:0 0 12px; font-size:16px; font-weight:650}
.split{display:grid; grid-template-columns:1.3fr 1fr; gap:14px; align-items:start}
h2.sect{font-size:21px; font-weight:700; margin:30px 0 14px; letter-spacing:-.3px}

.btn{display:inline-flex; align-items:center; gap:8px; justify-content:center; border:1px solid var(--border);
  background:var(--surface); color:var(--text); border-radius:var(--r-btn); padding:11px 18px;
  font-weight:600; font-size:14.5px}
.btn:hover{background:var(--bg); border-color:var(--secondary)}
.btn.primary{background:var(--primary); border-color:var(--primary); color:#fff}
.btn.primary:hover{background:var(--primary-hover)}
.btn.danger{background:var(--surface); border-color:var(--border); color:var(--danger)}
.btn.sm{padding:8px 13px; font-size:13.5px; border-radius:10px}
.btn:disabled{opacity:.45; cursor:not-allowed}

.chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--bg);
  border-radius:999px; padding:4px 11px; font-size:12.5px; color:var(--muted); white-space:nowrap; font-weight:550}
.chip.g{background:var(--soft-mint); border-color:#BFE9DC; color:var(--success)}
.chip.o{background:var(--soft-beige); border-color:#F3D5AC; color:var(--warning)}
.chip.r{background:var(--soft-pink); border-color:#F6C6DC; color:var(--danger)}
.chip.a{background:var(--lilac); border-color:#D6CCFB; color:var(--primary)}

.fld{display:block; margin-bottom:16px; font-size:13.5px; color:var(--muted); font-weight:550}
.fld input, .fld textarea, .fld select{display:block; width:100%; margin-top:7px; background:var(--surface);
  color:var(--text); border:1px solid var(--border); border-radius:var(--r-input); padding:11px 14px;
  font-size:15px; line-height:1.5}
.fld textarea{min-height:130px; resize:vertical}
.fld input:focus, .fld textarea:focus, .fld select:focus{outline:0; border-color:var(--primary); box-shadow:0 0 0 3px rgba(111,61,255,.14)}

.note{border:1px solid var(--border); border-left:3px solid var(--primary); background:var(--surface);
  border-radius:0 14px 14px 0; padding:14px 18px; font-size:14.5px; margin:14px 0}
.note.warn{border-color:#F3D5AC; border-left-color:var(--warning); background:var(--soft-beige); color:#8A5A0B}
.note.ok{border-color:#BFE9DC; border-left-color:var(--success); background:var(--soft-mint); color:#0A6B4F}
.note.bad{border-color:#F6C6DC; border-left-color:var(--danger); background:var(--soft-pink); color:#8E1F32}

.drop{border:2px dashed var(--border); border-radius:16px; padding:36px 24px; text-align:center;
  background:var(--surface); transition:border-color .12s, background .12s}
.drop.over{border-color:var(--primary); background:var(--lilac)}
.drop .ico{width:52px; height:52px; margin:0 auto 14px; border-radius:15px; background:var(--lilac);
  color:var(--primary); display:grid; place-items:center}
.drop b{display:block; font-size:17px; margin-bottom:6px}
.drop span{color:var(--muted); font-size:14px}
input[type=file]{display:none}

table{width:100%; border-collapse:collapse; font-size:13.5px}
th{background:var(--bg); text-align:left; padding:10px 12px; font-weight:650; color:var(--muted);
  border-bottom:1px solid var(--border); position:sticky; top:0}
td{padding:10px 12px; border-bottom:1px solid var(--border-soft); vertical-align:top}
tr:last-child td{border-bottom:0}
tr.bad td{background:var(--soft-pink)}
.tw{overflow:auto; max-height:380px; border:1px solid var(--border); border-radius:12px}

.rows{display:flex; flex-direction:column; gap:10px}
.row{display:grid; grid-template-columns:4px 1fr auto; gap:16px; align-items:start; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-card); padding:16px 18px}
.row:hover{border-color:var(--secondary); box-shadow:var(--shadow)}
.stripe{border-radius:3px; align-self:stretch; min-height:44px; background:var(--border)}
.stripe.wait{background:var(--warning)} .stripe.done{background:var(--success)}
.row .who{font-weight:650; margin-bottom:4px}
.row .meta{color:var(--muted); font-size:13px}
.row .acts{display:flex; gap:8px; align-items:center}

.msg{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:18px 20px; margin-bottom:10px}
.msg.pin{border-color:var(--primary)}
.msg .t{font-weight:650; font-size:16px}
.msg .b{margin-top:10px; line-height:1.7}

.code{background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:14px 16px;
  font-family:Consolas,"Courier New",monospace; font-size:13px; overflow-x:auto; white-space:pre; line-height:1.7}

.back{position:fixed; inset:0; background:rgba(31,41,55,.42); display:grid; place-items:center; padding:24px; z-index:60}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:20px; width:min(760px,100%);
  max-height:86vh; display:flex; flex-direction:column; box-shadow:0 24px 64px rgba(31,41,55,.22)}
.mh{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; padding:22px 24px 18px; border-bottom:1px solid var(--border)}
.mh h3{margin:0; font-size:19px; font-weight:700}
.mb{padding:20px 24px; overflow:auto}
.mf{padding:16px 24px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap}
.x{background:none; border:0; color:var(--muted); font-size:22px; line-height:1; padding:2px 8px; border-radius:8px}
.x:hover{background:var(--bg); color:var(--text)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:9px 16px; font-size:14px}
.kv .k{color:var(--muted)}

.toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--text); color:#fff;
  padding:13px 22px; border-radius:13px; font-size:14px; box-shadow:0 12px 32px rgba(31,41,55,.28); z-index:90}
.empty{text-align:center; padding:48px 20px; color:var(--muted); background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-card)}
.empty b{display:block; color:var(--text); font-size:17px; margin-bottom:5px}

@media (max-width:1180px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} .split{grid-template-columns:1fr} }
@media (max-width:1000px){
  .app{grid-template-columns:72px 1fr}
  .brand-text,.rolebox,.side-foot{display:none}
  .nav button{justify-content:center; padding:11px 0}
  .nav button span:not(.ico){display:none}
  .content{padding:20px 18px 56px} .topbar{padding:0 18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<script src="data-shift-peak.js"></script>

<script>
/* =======================================================================
   ОСНОВА · админка
   Рабочее место продакта: загрузка данных, ответы на обращения,
   сообщения в канал учреждений.

   Данные берутся из тех же файлов, что и рабочее место цензора
   (data-reference.js, data-shift-peak.js) — общий модуль данных.
   Ничего не сохраняется: перезагрузка возвращает всё к началу.
   ======================================================================= */

const REF = window.OSNOVA_REF || { appeals: [], channel: [], assignments: [], legal: [] };
const MATERIALS = (window.OSNOVA_SETS && window.OSNOVA_SETS['shift-peak']) || { materials: [], total: 0 };

/* ---------------- иконки ---------------- */
const SVG = d => '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
const ICON = {
  home:    SVG('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>'),
  upload:  SVG('<path d="M12 16V4"/><path d="M8 8l4-4 4 4"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/>'),
  mail:    SVG('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'),
  channel: SVG('<path d="M21 12a8 8 0 01-11.5 7.2L3 21l1.8-6.5A8 8 0 1121 12z"/>'),
  db:      SVG('<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>'),
  clock:   SVG('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  check:   SVG('<path d="M20 6L9 17l-5-5"/>'),
  alert:   SVG('<path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/>'),
};

/* ---------------- состояние ---------------- */
const S = {
  view: 'home',
  загружено: { когда: '28.08.2026 07:40', строк: MATERIALS.total, файл: 'выгрузка_ЗТ_28-08.csv' },
  разбор: null,          // результат разбора выбранного файла
  канал: [...REF.channel],
  обращения: REF.appeals.map(a => ({ ...a })),
};

const NAV = [
  ['home',    ICON.home,    'Обзор'],
  ['upload',  ICON.upload,  'Загрузка данных'],
  ['appeals', ICON.mail,    'Обращения'],
  ['channel', ICON.channel, 'Канал ОСНОВЫ'],
];

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
function toast(m){ const r = document.getElementById('toastRoot');
  r.innerHTML = '<div class="toast">' + esc(m) + '</div>';
  clearTimeout(toast._t); toast._t = setTimeout(() => r.innerHTML = '', 3400); }
function modal(html){ document.getElementById('modalRoot').innerHTML =
  '<div class="back" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>'; }
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function go(v){ S.view = v; render(); }

/* ---------------- обзор ---------------- */
function renderHome(){
  const ждут = S.обращения.filter(a => a.status !== 'отвечено').length;
  document.getElementById('content').innerHTML = `
    <div class="page-head"><h1>Обзор</h1>
      <p>Что происходит на контуре и что требует вашего решения.</p></div>

    <div class="stats">
      <div class="stat"><div class="badge-ico" style="background:var(--lilac); color:var(--primary)">${ICON.db}</div>
        <div class="k">Материалов в базе</div><div class="v tnum">${S.загружено.строк}</div>
        <div class="d">последняя загрузка ${esc(S.загружено.когда)}</div></div>
      <div class="stat"><div class="badge-ico" style="background:${ждут ? 'var(--soft-beige)' : 'var(--soft-mint)'}; color:${ждут ? 'var(--warning)' : 'var(--success)'}">${ждут ? ICON.alert : ICON.check}</div>
        <div class="k">Обращений без ответа</div><div class="v tnum">${ждут}</div>
        <div class="d">${ждут ? 'норматив ответа — 3 дня' : 'все обращения закрыты'}</div></div>
      <div class="stat"><div class="badge-ico" style="background:var(--soft-blue); color:#2563EB">${ICON.channel}</div>
        <div class="k">Сообщений в канале</div><div class="v tnum">${S.канал.length}</div>
        <div class="d">видят все учреждения</div></div>
      <div class="stat"><div class="badge-ico" style="background:var(--soft-mint); color:var(--success)">${ICON.clock}</div>
        <div class="k">Учреждений на контуре</div><div class="v tnum">1</div>
        <div class="d">ИК-5, пилот</div></div>
    </div>

    ${ждут ? `<div class="note warn"><b>Ждут ответа: ${ждут}.</b> Ближайший срок — ${esc(S.обращения.find(a => a.status !== 'отвечено').due)}.
      <button class="btn sm" style="margin-left:10px" onclick="go('appeals')">Перейти к обращениям</button></div>` : ''}

    <h2 class="sect">Быстрые действия</h2>
    <div class="stats">
      <div class="card"><h3>Загрузить данные</h3>
        <div class="top-sub">Выгрузка из ЗТ в заданном формате пополняет базу материалов.</div>
        <div style="margin-top:14px"><button class="btn primary" onclick="go('upload')">Загрузить</button></div></div>
      <div class="card"><h3>Ответить на обращение</h3>
        <div class="top-sub">Ответ уходит заявителю и фиксируется в деле.</div>
        <div style="margin-top:14px"><button class="btn" onclick="go('appeals')">Открыть список</button></div></div>
      <div class="card"><h3>Написать в канал</h3>
        <div class="top-sub">Сообщение увидят сотрудники всех учреждений на контуре.</div>
        <div style="margin-top:14px"><button class="btn" onclick="go('channel')">Написать</button></div></div>
      <div class="card"><h3>Что ещё сюда встанет</h3>
        <div class="top-sub">Правила анализатора, пороги стопок, доступы учреждений, шаблоны актов.</div>
        <div style="margin-top:14px"><span class="chip">в следующих версиях</span></div></div>
    </div>
  `;
}

/* ---------------- загрузка данных ---------------- */

const КОЛОНКИ = ['id','дата','направление','канал','язык','отправитель','получатель','риск','резюме','основание','текст'];
const РИСКИ = ['зелёный','оранжевый','красный'];
const НАПРАВЛЕНИЯ = ['входящее','исходящее'];
const КАНАЛЫ = ['письмо','голосовое','видео'];

function renderUpload(){
  const р = S.разбор;
  document.getElementById('content').innerHTML = `
    <div class="page-head"><h1>Загрузка данных</h1>
      <p>Выгрузка из ЗТ пополняет базу материалов, с которой работают цензоры.</p></div>

    <div class="split">
      <div>
        <div class="drop" id="drop" ondragover="event.preventDefault(); this.classList.add('over')"
             ondragleave="this.classList.remove('over')" ondrop="onDrop(event)">
          <div class="ico">${ICON.upload}</div>
          <b>Перетащите файл сюда</b>
          <span>или <button class="btn sm" onclick="document.getElementById('file').click()">выберите на компьютере</button></span>
          <input type="file" id="file" accept=".csv,text/csv" onchange="onPick(event)">
        </div>

        ${р ? отчётРазбора(р) : ''}
      </div>

      <div>
        <div class="card">
          <h3>Формат файла</h3>
          <div class="top-sub" style="margin-bottom:12px">Таблица Excel, сохранённая как <b>CSV UTF-8</b>, разделитель — точка с запятой.
            Первая строка — заголовки ровно в таком порядке:</div>
          <div class="code">${КОЛОНКИ.join(';')}</div>
          <div style="margin-top:14px"><button class="btn sm" onclick="показатьПример()">Показать пример строки</button></div>
        </div>
        <div class="card">
          <h3>Что проверяется</h3>
          <div class="kv">
            <div class="k">Колонки</div><div>все ${КОЛОНКИ.length} и в нужном порядке</div>
            <div class="k">Риск</div><div>${РИСКИ.join(' · ')}</div>
            <div class="k">Направление</div><div>${НАПРАВЛЕНИЯ.join(' · ')}</div>
            <div class="k">Канал</div><div>${КАНАЛЫ.join(' · ')}</div>
            <div class="k">Обязательные</div><div>id, дата, отправитель, получатель, риск</div>
          </div>
          <div class="note warn" style="margin-bottom:0">Строки с ошибками не загружаются. Остальные загружаются — файл целиком не отклоняется.</div>
        </div>
      </div>
    </div>
  `;
}

function показатьПример(){

function читать(file){
  if (!/\.csv$/i.test(file.name)) {
    S.разбор = { файл: file.name, фатально: 'Нужен файл CSV. Сохраните таблицу в Excel через «Файл → Сохранить как → CSV UTF-8».' };
    render(); return;
  }
  const r = new FileReader();
  r.onload = () => { S.разбор = разобрать(file.name, String(r.result)); render(); };
  r.onerror = () => { S.разбор = { файл: file.name, фатально: 'Не удалось прочитать файл.' }; render(); };
  r.readAsText(file, 'utf-8');
}

/* Разбор CSV: точка с запятой, кавычки для полей с разделителем внутри. */
function строкаВПоля(строка){
  const поля = []; let тек = '', вКавычках = false;
  for (let i = 0; i < строка.length; i++) {
    const c = строка[i];
    if (c === '"') {
      if (вКавычках && строка[i + 1] === '"') { тек += '"'; i++; }
      else вКавычках = !вКавычках;
    } else if (c === ';' && !вКавычках) { поля.push(тек); тек = ''; }
    else тек += c;
  }
  поля.push(тек);
  return поля.map(x => x.trim());
}

function разобрать(имя, текст){
  const строки = текст.replace(/^﻿/, '').split(/\r?\n/).filter(x => x.trim());
  if (!строки.length) return { файл: имя, фатально: 'Файл пустой.' };

  const заголовки = строкаВПоля(строки[0]).map(x => x.toLowerCase());
  const нехватает = КОЛОНКИ.filter(k => !заголовки.includes(k));
  if (нехватает.length) {
    return { файл: имя, фатально: 'В заголовке не хватает колонок: ' + нехватает.join(', ') +
             '. Ожидаются: ' + КОЛОНКИ.join(', ') + '.' };
  }
  const индекс = {}; КОЛОНКИ.forEach(k => индекс[k] = заголовки.indexOf(k));

  const годные = [], плохие = [];
  for (let i = 1; i < строки.length; i++) {
    const поля = строкаВПоля(строки[i]);
    const зап = {}; КОЛОНКИ.forEach(k => зап[k] = поля[индекс[k]] || '');
    const беды = [];
    ['id','дата','отправитель','получатель','риск'].forEach(k => { if (!зап[k]) беды.push('пусто: ' + k); });
    if (зап.риск && !РИСКИ.includes(зап.риск.toLowerCase())) беды.push('риск: «' + зап.риск + '»');
    if (зап.направление && !НАПРАВЛЕНИЯ.includes(зап.направление.toLowerCase())) беды.push('направление: «' + зап.направление + '»');
    if (зап.канал && !КАНАЛЫ.includes(зап.канал.toLowerCase())) беды.push('канал: «' + зап.канал + '»');
    if (беды.length) плохие.push({ строка: i + 1, зап, беды });
    else годные.push(зап);
  }
  return { файл: имя, всего: строки.length - 1, годные, плохие };
}

      </div>

      ${р.плохие.length ? `
        <div class="note bad"><b>Строки с ошибками не загрузятся.</b> Поправьте их в Excel и загрузите файл ещё раз —

          ${показ.map(z => `<tr><td>${esc(z.id)}</td><td>${esc(z.дата)}</td>

        <button class="btn" onclick="S.разбор=null; render()">Отменить</button>
        <button class="btn primary" onclick="загрузить()" ${р.годные.length ? '' : 'disabled'}>
          Загрузить в базу · ${р.годные.length}</button>

    </div>`;
}

function загрузить(){

}
